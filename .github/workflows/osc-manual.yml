# OSC fork CI wrapper - dispatch with `target_ref` to test any branch.
# Jobs are copied verbatim from the repository's own .github/workflows/lint.yml
# (`lint`) and test.yml (`smoke-tests`, `test`), minus the push/pull_request
# triggers (workflow_dispatch with target_ref instead) and with each checkout
# taking `ref: ${{ inputs.target_ref }}` plus a Provenance step.
# DELIBERATELY EXCLUDED (upstream's own pull_request run covers these when its
# path filters select them; add before a probe that needs them):
#   - frontend-tests.yml (Node/npm; path-filtered to frontend/**)
#   - security-tests.yml (live provider secrets; nightly/manual upstream)
#   - docker.yml, e2e-aaxt.yml (live account/secrets)
# This file is intentionally not sent upstream.
name: OSC manual CI

on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: 'Git branch, tag, or 40-character commit SHA to validate'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: osc-manual-${{ github.repository }}-${{ inputs.target_ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_ref }}

      - name: Provenance
        shell: bash
        run: |
          set -euo pipefail
          echo "tested_target_ref=${{ inputs.target_ref }}"
          checked_out_sha="$(git rev-parse HEAD)"
          if [[ ! "$checked_out_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::git rev-parse HEAD did not produce a 40-character commit SHA: $checked_out_sha"
            exit 1
          fi
          printf 'checked-out SHA: %s\n' "$checked_out_sha"


      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Verify Python version
        run: |
          python --version
          python -c "import sys; assert sys.version_info >= (3, 11), f'Python {sys.version} < 3.11'"
          echo "✅ Python 3.11+ confirmed for linting"

      - name: Cache Python dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-3.11-lint-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-3.11-lint-
            ${{ runner.os }}-pip-3.11-
            ${{ runner.os }}-pip-

      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff==0.6.9

      - name: Check formatting with ruff
        run: |
          ruff format --check --diff .

      - name: Lint with ruff
        run: |
          ruff check .

      - name: Token discipline gate (F3 #1172)
        run: |
          # Ratchet: fails on a NEW hardcoded color/spacing/radius/type value in
          # web/static/css (use tokens.css custom props). Pre-existing violations
          # are baselined in .token-lint-baseline.txt and migrated down over time.
          python scripts/token_lint.py --baseline .token-lint-baseline.txt web/static/css

      - name: Native-dialog gate (F1 #1170)
        run: |
          # Ratchet: fails on a NEW native confirm()/alert()/prompt() in templates/
          # or web/static/js (use the Dialog component instead — design-floor #1170).
          # Pre-existing callers are baselined in .native-dialog-lint-baseline.txt
          # and migrated down as F1's caller-migration lands.
          python scripts/native_dialog_lint.py --baseline .native-dialog-lint-baseline.txt

      - name: Principal-threading gate (#1252 P6 / ADR-071 D5)
        run: |
          # Ratchet: fails on a NEW principal-degradation site —
          # `context.get("user_id") if ... else None` (silently loses the
          # principal → unscoped reads). Thread the principal as a required
          # param from the host boundary instead. Pre-existing sites are
          # baselined in .principal-threading-baseline.txt and migrated down
          # as ADR-071 D4 threading lands.
          python scripts/principal_threading_lint.py --baseline .principal-threading-baseline.txt

      - name: Mailbox filename-length gate (#1616)
        run: |
          # Ratchet: fails on a NEW mailboxes/ path over 180 characters —
          # Windows' effective MAX_PATH (260 chars, incl. clone-path prefix)
          # makes this repo un-cloneable on Windows once exceeded (confirmed
          # by the windows-clone-test job in windows-test.yml, currently red
          # for pre-existing offenders). Pre-existing long paths are
          # baselined in .mailbox-filename-lint-baseline.txt and left as
          # historical record — this only blocks new ones going forward.
          python scripts/mailbox_filename_lint.py --baseline .mailbox-filename-lint-baseline.txt

      - name: Bearer-credential gate (#1845)
        run: |
          # The repo is PUBLIC. Invite codes and API/bot tokens never travel
          # through mailboxes/, docs/ or dev/ — masked forms only (ABCD…WXYZ).
          # Found on 2026-09-24: three LIVE unused invite tokens in full form in
          # tracked session logs + an omnibus log. Historical placeholders and
          # test fixtures are baselined by path:sha1 (the baseline never holds a
          # credential); this blocks NEW ones and prints only masked excerpts.
          python scripts/mailbox_bearer_lint.py --roots mailboxes docs dev --baseline .mailbox-bearer-lint-baseline.txt

      - name: Current-state page gate (R6 step 3)
        run: |
          # BRIEFING-CURRENT-STATE.md is a short "Now" page (size cap in its own front
          # matter, default 12000 bytes), and its last_updated must not be older than
          # its newest attested line. History lives in briefing-current-state-history.log.
          python scripts/check-current-state.py

      - name: Concept-link gate (methodology-56)
        run: |
          # Every declared `Concept:` path must exist and name the mechanism back
          # (scripts/check-concept-links.py). A missing Concept line is counted, not
          # failed, until 2026-11-01 (mechanism-sunset-or-renew). Only a BROKEN link
          # (renamed/deleted concept doc, or a doc edit that drops the mechanism's
          # name) turns main red. CIO's proposal 2026-10-14; Lead's gate, Lead's yes.
          python scripts/check-concept-links.py

      - name: Quality summary
        run: |
          echo "## Code Quality Results" >> $GITHUB_STEP_SUMMARY
          echo "✅ ruff format check passed" >> $GITHUB_STEP_SUMMARY
          echo "✅ ruff lint (E9,F63,F7,F82,I) passed" >> $GITHUB_STEP_SUMMARY
          echo "✅ token-discipline gate passed (no new hardcoded values)" >> $GITHUB_STEP_SUMMARY
          echo "✅ native-dialog gate passed (no new native confirm/alert/prompt)" >> $GITHUB_STEP_SUMMARY
          echo "✅ principal-threading gate passed (no new context.get user_id degradations)" >> $GITHUB_STEP_SUMMARY
          echo "✅ mailbox filename-length gate passed (no new mailboxes/ path over 180 chars)" >> $GITHUB_STEP_SUMMARY
          echo "Environment: Python 3.11" >> $GITHUB_STEP_SUMMARY
  smoke-tests:
    name: Smoke Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5433
      POSTGRES_USER: piper
      POSTGRES_PASSWORD: dev_changeme_in_production
      POSTGRES_DB: piper_morgan
      # #1382 house pattern (mirrors security-tests.yml): the runner's keyring is
      # dead, so KeychainService routes to the encrypted-DB store, which
      # fail-closes credential WRITES without a master key (correct — and it
      # broke the smoke OAuth tests). TEST-ONLY key, deliberately committed:
      # ephemeral CI database, no real credential ever stored.
      ENCRYPTION_MASTER_KEY: "Y2ktdGVzdC1vbmx5LTEzODItbmV2ZXItcHJvZCEhMzI="
      # R5 (2026-10-04): the app no longer falls back to a hardcoded JWT secret —
      # it refuses to start without JWT_SECRET_KEY (web/app.py re-raises). pytest
      # gets a fake one from tests/conftest.py, but steps that import web.app
      # OUTSIDE pytest (the documents-router mount probe) need it here. TEST-ONLY,
      # deliberately committed, same house pattern as the key above.
      JWT_SECRET_KEY: "ci-test-only-jwt-secret-never-used-in-any-deploy-32b"

    # Smoke includes DB-backed tests (the local dev DB is always up, so smoke
    # is DB-inclusive by design) — the job needs the same postgres service the
    # Security Test Suite runs, or those tests error at setup with
    # connection-refused (CI-red root cause 3, 2026-07-19).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: piper
          POSTGRES_PASSWORD: dev_changeme_in_production
          POSTGRES_DB: piper_morgan
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_ref }}

      - name: Provenance
        shell: bash
        run: |
          set -euo pipefail
          echo "tested_target_ref=${{ inputs.target_ref }}"
          checked_out_sha="$(git rev-parse HEAD)"
          if [[ ! "$checked_out_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::git rev-parse HEAD did not produce a 40-character commit SHA: $checked_out_sha"
            exit 1
          fi
          printf 'checked-out SHA: %s\n' "$checked_out_sha"


      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Cache Python dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-3.11-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-3.11-
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run migrations
        run: python -m alembic upgrade head

      - name: Run smoke tests (critical path)
        run: |
          echo "🔥 Running smoke test suite"
          # Spec's CI-gate package item 2 (PM-approved 2026-10-04): show EVERY
          # smoke failure, not the first. pytest.ini's addopts carry
          # `-x --maxfail=1` (a local fast-fail convenience), which made each CI
          # run reveal one failure at a time — the "fixed, then red again"
          # loop. Override them here, keeping the ignores and the LOAD-BEARING
          # --import-mode=importlib (#1346; dropping it breaks ~20 files' collection).
          python -m pytest -m smoke -q --tb=short \
            -o addopts="--ignore=tests/archive --ignore=*/archive/* --ignore=services/integrations/*/tests --ignore=services/mcp/server/test_*.py --ignore=dev/ --import-mode=importlib"
          echo "✅ Smoke tests passed - proceeding with full suite"

  test:
    name: Full Test Suite
    runs-on: ubuntu-latest
    needs: smoke-tests

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5433
      POSTGRES_USER: piper
      POSTGRES_PASSWORD: dev_changeme_in_production
      POSTGRES_DB: piper_morgan
      # #1382 house pattern (mirrors security-tests.yml): the runner's keyring is
      # dead, so KeychainService routes to the encrypted-DB store, which
      # fail-closes credential WRITES without a master key (correct — and it
      # broke the smoke OAuth tests). TEST-ONLY key, deliberately committed:
      # ephemeral CI database, no real credential ever stored.
      ENCRYPTION_MASTER_KEY: "Y2ktdGVzdC1vbmx5LTEzODItbmV2ZXItcHJvZCEhMzI="
      # R5 (2026-10-04): the app no longer falls back to a hardcoded JWT secret —
      # it refuses to start without JWT_SECRET_KEY (web/app.py re-raises). pytest
      # gets a fake one from tests/conftest.py, but steps that import web.app
      # OUTSIDE pytest (the documents-router mount probe) need it here. TEST-ONLY,
      # deliberately committed, same house pattern as the key above.
      JWT_SECRET_KEY: "ci-test-only-jwt-secret-never-used-in-any-deploy-32b"

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: piper
          POSTGRES_PASSWORD: dev_changeme_in_production
          POSTGRES_DB: piper_morgan
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_ref }}

      - name: Provenance
        shell: bash
        run: |
          set -euo pipefail
          echo "tested_target_ref=${{ inputs.target_ref }}"
          checked_out_sha="$(git rev-parse HEAD)"
          if [[ ! "$checked_out_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::git rev-parse HEAD did not produce a 40-character commit SHA: $checked_out_sha"
            exit 1
          fi
          printf 'checked-out SHA: %s\n' "$checked_out_sha"


      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Verify Python version
        run: |
          python --version
          python -c "import sys; assert sys.version_info >= (3, 11), f'Python {sys.version} < 3.11'"
          echo "✅ Python 3.11+ confirmed in CI"
          echo "Python version: $(python --version)" >> $GITHUB_STEP_SUMMARY

      - name: Cache Python dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-3.11-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-3.11-
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Environment consistency check
        run: |
          echo "=== Environment Verification ==="
          echo "Python version: $(python --version)"
          echo "Pip version: $(pip --version)"
          echo "Installed packages:"
          pip list | head -10
          echo "=== Consistency with production requirements ==="
          python -c "
          import sys
          required = (3, 11)
          current = sys.version_info[:2]
          assert current >= required, f'Python {current} < {required}'
          print('✅ Version consistency verified')
          "

      - name: Run migrations
        run: python -m alembic upgrade head

      # #1452 wave 14: the doc tests 404'd in CI with FastAPI's bare "Not Found"
      # — the signature of an UNMOUNTED router (mount_router swallows import
      # errors into captured logs). This probe imports the route module directly
      # so a CI-only import failure surfaces as a real traceback, then asserts
      # the routes are actually on the app.
      - name: Probe documents router mount
        run: |
          python - <<'PY'
          import web.api.routes.documents  # a broken transitive import tracebacks here
          from web.app import app
          doc_paths = [r.path for r in app.routes if "/api/v1/documents" in getattr(r, "path", "")]
          assert doc_paths, "documents router NOT mounted despite clean import"
          print(f"documents router mounted: {len(doc_paths)} routes")
          PY

      # #1452: ONE full sweep governed by the burn-down gate. The former named
      # subset steps (interface/contract/bypass/accuracy) ran subsets of this
      # same sweep under addopts' -x, so any backlog test in a subset turned the
      # job red before the gate could judge — the gate must see the whole run.
      - name: Full suite under the burn-down gate (#1452)
        run: |
          set -o pipefail
          python -m pytest tests/ -m "not llm" -q --tb=no \
            -o addopts="--ignore=tests/archive --ignore=services/integrations --ignore=dev/ --import-mode=importlib" \
            2>&1 | tee /tmp/fullsuite.out || true
          python scripts/check_fullsuite_backlog.py /tmp/fullsuite.out | tee /tmp/gate.out
          GATE=$?
          grep "backlog size" /tmp/gate.out >> $GITHUB_STEP_SUMMARY || true
          exit $GATE

      # #1452: free diagnostics — when the gate flags NEW failures, rerun just
      # those nodes with tracebacks so the log carries the WHY (tb=no above
      # keeps the main sweep readable; this step only fires on failure).
      # #1452: NON-GATING diagnostics for the env-oscillator backlog band —
      # entries that pass keyed-local but fail here. The gate tolerates them
      # (they're listed), so the main sweep never shows their WHY (tb=no) and
      # the failure-diagnose step below only covers NEW failures. This step
      # reruns them with tracebacks every run so the oscillator chase has
      # CI-side evidence. Always || true — informational only.
      - name: Diagnose env-oscillator backlog entries (non-gating)
        if: always()
        run: |
          NODES="tests/unit/web/api/routes/test_radar.py tests/integration/test_publish_gaps.py tests/unit/services/intent_service/test_github_query_handlers.py::TestCommentIssueResults::test_formats_comment_confirmation_correctly tests/unit/services/intent_service/test_comment_issue_graceful_1159.py tests/validation/test_pm034_claims_validation.py tests/unit/services/standup/test_standup_assembler_1269.py::TestBuildStandupAssembler::test_wires_live_radar_sources_and_calendar"
          python -m pytest $NODES -q --tb=short \
            -o addopts="--import-mode=importlib" || true

      - name: Diagnose new failures with tracebacks
        if: failure()
        run: |
          NODES=$(grep -E "^  \+ tests/" /tmp/gate.out | awk '{print $2}' | head -25 | tr '\n' ' ')
          if [ -n "$NODES" ]; then
            python -m pytest $NODES -q --tb=short \
              -o addopts="--import-mode=importlib" || true
          else
            echo "no new-failure nodes to diagnose"
          fi


  # Fossil jobs removed 2026-07-19 (#1436 CI-honesty pass): performance-regression-check,
  # performance-benchmarks (GREAT-5), tiered-coverage-enforcement. All three enforced
  # claims about services/orchestration/* (deleted, #1436 Family-2) — the perf jobs
  # imported the deleted OrchestrationEngine and the coverage job measured a directory
  # that no longer exists. Real perf/coverage gates for the LIVE system: see the
  # tracking issue filed with this change (fossil scripts recoverable from git history).
