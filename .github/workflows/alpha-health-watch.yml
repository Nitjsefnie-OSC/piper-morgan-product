# Alpha health watch (#2085 track 2, #2101) — the only thing that tells a person
# alpha is stuck when no seat is awake.
#
# Shape (HOST, 2026-10-19): a `schedule:` trigger has a FIVE-MINUTE floor and runs
# are often delayed by minutes, so one run cannot probe every minute. Instead each
# run loops FIVE probes one minute apart and fails when 3 or more of its five miss:
# one-minute resolution, an email on a three-minute stall, about five minutes of
# runner time per run. One failed probe in five is silent (a blip). The gap between
# runs is the floor plus GitHub's delay; a stall that starts and ends inside that
# gap is missed. GitHub's failure email reaches whoever watches this repo's Actions
# failures (xian's notification settings decide), so the forced-failure dispatch
# below is the acceptance test: run it once with force_fail=true and confirm the
# email arrives.
#
# A probe "misses" when /health does not answer 200 within 10 s, or answers with
# `"status":"degraded"` (the #2083 body status: the app is up but its database
# probe failed).
#
# Backup alert (HOST's item 4, Exec 2026-10-19 18:10): the email depends on one
# account's notification settings, so a failing run ALSO opens, or comments on, one
# reused issue titled "Alpha health watch: failing", assigned to the repo owner, with
# the repo's own GITHUB_TOKEN. GitHub mails an assignment and every comment on an
# assigned issue through a second channel (issue notifications), and the issue is
# visible on the repo whatever the mail does. A forced run exercises the same path
# and says so in its comment; close the issue by hand after a forced test or once
# alpha is steady again (the next real failure reopens or comments on it).
name: Alpha Health Watch

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      force_fail:
        description: "Force a failure to test that the alert email arrives"
        type: boolean
        default: false

concurrency:
  group: alpha-health-watch
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      HEALTH_URL: https://alpha.pipermorgan.ai/health
      PROBES: "5"
      MISS_LIMIT: "3"
    steps:
      - name: Five probes, one minute apart
        id: probe
        shell: bash
        run: |
          set -u
          misses=0
          for i in $(seq 1 "$PROBES"); do
            started=$(date -u +%H:%M:%S)
            body=$(curl -sS --max-time 10 -w '\n%{http_code}' "$HEALTH_URL" 2>/dev/null || echo -e '\n000')
            code=$(printf '%s' "$body" | tail -n1)
            json=$(printf '%s' "$body" | sed '$d')
            if [ "$code" != "200" ]; then
              misses=$((misses+1)); echo "$started probe $i MISS http=$code"
            elif printf '%s' "$json" | grep -q '"status": *"degraded"'; then
              misses=$((misses+1)); echo "$started probe $i MISS degraded ($(printf '%s' "$json" | tr -d '\n' | cut -c1-160))"
            else
              echo "$started probe $i ok"
            fi
            [ "$i" -lt "$PROBES" ] && sleep 60
          done
          echo "misses=$misses of $PROBES (limit $MISS_LIMIT)"
          echo "misses=$misses of $PROBES" >> "$GITHUB_OUTPUT"
          if [ "${{ inputs.force_fail }}" = "true" ]; then
            echo "kind=forced" >> "$GITHUB_OUTPUT"
            echo "FORCED FAILURE (acceptance test of the alert email)"; exit 1
          fi
          if [ "$misses" -ge "$MISS_LIMIT" ]; then
            echo "kind=stall" >> "$GITHUB_OUTPUT"
            echo "ALPHA STALL: $misses of $PROBES probes missed in five minutes"; exit 1
          fi

      # Backup alert: one reused, assigned issue (see the header). Runs only when the
      # probe step failed, forced or real.
      - name: Open or comment on the assigned issue
        if: failure() && steps.probe.outcome == 'failure'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ASSIGNEE: ${{ github.repository_owner }}
          TITLE: "Alpha health watch: failing"
          KIND: ${{ steps.probe.outputs.kind }}
          MISSES: ${{ steps.probe.outputs.misses }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -u
          when=$(date -u +'%Y-%m-%d %H:%M:%SZ')
          if [ "$KIND" = "forced" ]; then
            line="FORCED TEST of this alert path ($when): probes $MISSES; close this issue after reading it. Run: $RUN_URL"
          else
            line="ALPHA STALL ($when): $MISSES probes of https://alpha.pipermorgan.ai/health missed within five minutes. Run: $RUN_URL"
          fi
          number=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number,title \
            --jq "[.[] | select(.title == \"$TITLE\")][0].number // empty")
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$line"
            echo "commented on #$number"
          else
            gh issue create --title "$TITLE" --assignee "$ASSIGNEE" --body "$(printf '%s\n\n%s' \
              "Opened by the Alpha Health Watch workflow (.github/workflows/alpha-health-watch.yml) as the backup to the failure email. Each later failure comments here; close it once alpha is steady." \
              "$line")"
            echo "opened a new issue"
          fi
